openapi: 3.0.0
info:
  title: customer support
  version: 1.0.0
servers:
  - url: http://localhost:3000/support
  - url: http://localhost:3000/
  - url: http://localhost:3000/send-status
  - url: http://localhost:3000/taxi
tags:
  - name: admin account
  - name: admin profile
  - name: drivers
  - name: parents
  - name: taxi
  - name: other api's
paths:
  /admin/add/dmv-criminal-records:
    post:
      tags:
        - admin account
      summary: add dmv and criminal record
      description: >-
        ### Add Request and Response Description


        This HTTP POST request is used to submit data to the root endpoint. The
        request body should be in raw format and include the following
        parameters:


        - `driverEmail`: (string) The email of the driver.
            
        - `agentEmail`: (string) The email of the agent.
            

        #### Request Body


        - `driverEmail`: (string) The email of the driver.
            
        - `agentEmail`: (string) The email of the agent.
            

        #### Response


        The response for this request is a JSON schema. The structure of the
        response will contain the relevant data in the specified format.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                driverEmail: andrian@treelinktechnologies.com
                agentEmail: andrian@treelinktechnologies.com
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /admin/profile/create:
    post:
      tags:
        - admin profile
      summary: create admin profile
      description: |-
        ### Create Admin Profile

        This endpoint allows the creation of a new admin profile.

        #### Request Body

        - fullName (string, required): The full name of the admin.
            
        - age (number, required): The age of the admin.
            
        - address (string, required): The address of the admin.
            

        #### Response

        The response for this request follows the JSON schema below:

        ``` json
        {
          "type": "object",
          "properties": {
            "status": {
              "type": "string"
            },
            "message": {
              "type": "string"
            }
          }
        }

         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                fullName: mike sample name
                age: 12
                address: mike sample address
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: UserId
          in: header
          schema:
            type: string
          example: 7020e258-43d8-4265-92e7-ce8a19abaa7b
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /admin/{email}:
    delete:
      tags:
        - admin account
      summary: delete admin by email
      description: >-
        The API endpoint sends an HTTP DELETE request to
        localhost:3000/support/admin/:email to delete the admin user with the
        specified email.


        ### Response


        The response of this request is a JSON schema representing the structure
        of the data returned upon successful deletion of the admin user.
      parameters:
        - name: email
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /support/admin/{email}:
    get:
      tags:
        - admin account
      summary: get customer support by email
      description: >-
        # Get Admin Support Information


        This endpoint retrieves the support information for the admin with the
        specified email.


        ## Request


        ### Path Parameters


        - `email` (string, required): The email address of the admin for whom
        support information is requested.
            

        ## Response


        The response for this request is a JSON object conforming to the
        following schema:


        ``` json

        {
          "type": "object",
          "properties": {
            "adminId": {
              "type": "string"
            },
            "name": {
              "type": "string"
            },
            "email": {
              "type": "string"
            },
            "supportTickets": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "ticketId": {
                    "type": "string"
                  },
                  "subject": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }

         ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: email
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dmv-criminal-records:
    post:
      tags:
        - admin account
      summary: send status dmv criminal records
      description: >-
        This endpoint allows you to send the status of DMV criminal records for
        a driver.


        ### Request Body


        - `driverEmail` (string): The email of the driver.
            
        - `description` (string): The status of the DMV criminal records, which
        can be either "approved" or "deny".
            
        - `dmvFileBase64` (file): The base64 encoded image of the DMV records.
            

        ### Response


        The response will include the status of the request, along with any
        additional information or error messages.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                driverEmail: shannonlee+1234@gmail.com
                description: approved
                dmvFileBase64: image base 64
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /admin/send-status/document-verification:
    post:
      tags:
        - admin account
      summary: send status document verification
      description: >-
        This endpoint is used to send the status of document verification for a
        driver to the admin support.


        ### Request Body


        - `driverEmail` (string): The email address of the driver for whom the
        document verification status is being sent.
            
        - `description` (string): The status of the document verification
        process.
            

        ### Example


        ``` json

        {
            "driverEmail": "johndoe+1234@gmail.com",
            "description": "in progress"
        }

         ```

        ### Response


        The response of this request is a JSON schema documenting the status of
        the document verification process for the driver.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                driverEmail: johndoe+1234@gmail.com
                description: in progress
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /admin/profile/{id}:
    delete:
      tags:
        - admin profile
      summary: delete by cs id
      description: >-
        ### Delete Admin Profile


        This endpoint is used to delete the profile of an admin.


        #### Request


        - Method: DELETE
            
        - URL: `localhost:3000/support/admin/profile/:id`
            
        - Path Parameters:
            
            - id: The unique identifier of the admin profile to be deleted.
                

        #### Response


        The response for this request is a JSON schema describing the structure
        of the response body. The specific details of the response body will
        depend on the implementation of the backend server.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    get:
      tags:
        - admin profile
      summary: get by cs id
      description: >-
        # Get Admin Profile


        This endpoint retrieves the profile of an admin based on the provided
        ID.


        ## Request


        ### Path Parameters


        - `id` (string, required) - The ID of the admin profile to retrieve.
            

        ## Response


        The response for this request is a JSON object representing the admin
        profile, following the schema below:


        ``` json

        {
          "type": "object",
          "properties": {
            "id": {
              "type": "string"
            },
            "username": {
              "type": "string"
            },
            "email": {
              "type": "string"
            },
            "role": {
              "type": "string"
            },
            "createdAt": {
              "type": "string",
              "format": "date-time"
            },
            "updatedAt": {
              "type": "string",
              "format": "date-time"
            }
          }
        }

         ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /admin/profile/edit/{id}:
    post:
      tags:
        - admin profile
      summary: edit by cs id
      description: >-
        This endpoint allows administrators to edit the profile of a user with
        the specified ID. The request should be sent as an HTTP POST to
        localhost:3000/support/admin/profile/edit/:id with the following payload
        in raw format:


        ``` json

        {
          "fullName": "sample name",
          "age": 13,
          "address": "sample address",
          "imageBase64": "image base 64"
        }

         ```

        The `fullName`, `age`, `address`, and `imageBase64` fields are used to
        update the user's full name, age, address, and profile image
        respectively.


        The response to this request will include the updated profile
        information of the user.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                fullName: sample name
                age: 13
                address: sample address
                imageBase64: image base 64
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /driver/{id}:
    delete:
      tags:
        - drivers
      summary: delete driver by id
      description: >-
        ### Delete Item by ID


        This endpoint is used to delete an item by its unique identifier.


        #### Request


        - Method: DELETE
            
        - URL: `localhost:3000//support/driver/:id`
            

        #### Request Body


        This request does not require a request body.


        #### Response


        The response for this request is a JSON schema representing the
        structure of the response body. It includes the properties and their
        data types that can be expected in the response.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - drivers
      summary: update driver
      description: >-
        ### Support Driver Details


        This endpoint allows you to submit support details for a specific driver
        identified by their ID.


        #### Request Body


        - `email` (string): The email address of the driver.
            
        - `driverName` (string): The name of the driver.
            
        - `phoneNumber` (string): The phone number of the driver.
            
        - `licenseNumber` (string): The license number of the driver.
            

        #### Response


        The response will contain the details of the support request for the
        specified driver.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: herlangga.driver48@yopmail.com
                driverName: Herlangga 48 bulaho
                phoneNumber: '+108782837465'
                licenseNumber: ASDAS231232
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /:
    get:
      tags:
        - drivers
      summary: get avail drivers nearby
      description: >-
        ### Get Nearby Locations


        This endpoint retrieves nearby locations based on the provided latitude,
        longitude, and radius.


        #### Request


        - Method: GET
            
        - URL: `localhost:3000/`
            
        - Query Parameters:
            
            - pageSize (number, required): The number of results per page.
                
            - page (number, required): The page number to retrieve.
                
            - atitude (number, required): The latitude of the location.
                
            - longitude (number, required): The longitude of the location.
                
            - radius (number, required): The search radius in kilometers.
                

        #### Response


        The response for this request is not provided as a JSON schema.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: pageSize
          in: query
          schema:
            type: integer
          example: '2'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: atitude
          in: query
          schema:
            type: number
          example: '37.337348'
        - name: longitude
          in: query
          schema:
            type: number
          example: '-121.893225'
        - name: radius
          in: query
          schema:
            type: integer
          example: '10'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /driver/{emailOrPhone}:
    get:
      tags:
        - drivers
      summary: get drivers details by email or phone
      description: >-
        This endpoint retrieves the details of a driver based on their email or
        phone number.


        ### Request


        - Path parameter:
            
            - `emailOrPhone` (string): The email or phone number of the driver.
                

        ### Response


        The response will include the details of the driver such as their name,
        contact information, and other relevant details.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: emailOrPhone
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /search/drivers/temp:
    post:
      tags:
        - drivers
      summary: search driver no parents
      description: >-
        This endpoint allows you to search for temporary drivers within a
        specified radius based on their location and availability.


        ### Request Body


        - latitude (number): The latitude of the location to search around.
            
        - longitude (number): The longitude of the location to search around.
            
        - radius (number): The radius in which to search for temporary drivers.
            
        - startDayOfTheWeek (string): The start day of the week for
        availability.
            
        - endDayOfTheWeek (string): The end day of the week for availability.
            

        ### Response Body


        The response will include the details of the temporary drivers found
        within the specified radius based on the provided location and
        availability.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                latitude: 37.7674733
                longitude: -121.9403833
                radius: 10
                startDayOfTheWeek: Sat
                endDayOfTheWeek: Sun
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /search/filter/drivers:
    get:
      tags:
        - drivers
      summary: search filter drivers
      description: >-
        This endpoint makes an HTTP GET request to the
        localhost:3000/support/search/filter/drivers to search and filter drivers
        based on various parameters. The request includes query parameters such
        as page, pageSize, driverName, licenseNumber, email, phoneNumber,
        registrationDate, and driverStatus.


        ### Request


        - Method: GET
            
        - Endpoint: localhost:3000/support/search/filter/drivers
            
        - Query Parameters:
            
            - page (number): The page number for paginated results.
                
            - pageSize (number): The number of results to be included in each page.
                
            - driverName (string): The name of the driver to be searched.
                
            - licenseNumber (string): The license number of the driver to be searched.
                
            - email (string): The email address of the driver to be searched.
                
            - phoneNumber (string): The phone number of the driver to be searched.
                
            - registrationDate (string): The registration date of the driver to be searched.
                
            - driverStatus (string): The status of the driver to be searched.
                

        ### Response


        The response of this request should be documented as a JSON schema.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: pageSize
          in: query
          schema:
            type: integer
          example: '10'
        - name: driverName
          in: query
          schema:
            type: string
          example: her
        - name: licenseNumber
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
          example: herlangga.driver51@yopmail.com
        - name: phoneNumber
          in: query
          schema:
            type: string
          example: '%2B19252101232'
        - name: registrationDate
          in: query
          schema:
            type: string
          example: '2024-05-08'
        - name: driverStatus
          in: query
          schema:
            type: string
          example: new
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /search/drivers/send-notification:
    post:
      tags:
        - drivers
      summary: send notification to all drivers
      description: >-
        ### Send Notification to Drivers


        This endpoint allows you to send notifications to drivers based on their
        user IDs.


        #### Request Body


        - `userId` (array of strings) - The user IDs of the drivers to whom the
        notification will be sent.
            

        #### Response


        The response will include the status of the notification sending
        process.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                userId:
                  - s123213
                  - '2312312321'
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /parent/{id}:
    delete:
      tags:
        - parents
      summary: delete parent by id
      description: >-
        ### Delete Parent


        This endpoint is used to delete a specific parent record identified by
        the unique ID in the URL.


        **Request Parameters**


        - `id` (path) : The unique identifier of the parent to be deleted.
            

        **Response**  

        The response will not contain a message body. A successful deletion will
        return a status code 200, while an unsuccessful deletion will return an
        appropriate error status code.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - parents
      summary: update parent
      description: >-
        # Support Parent


        This endpoint allows you to create a new support parent by providing the
        necessary details.


        ## Request


        - Method: POST
            
        - URL: `localhost:3000/support/parent/:id`
            
        - Body:
            

        | Key | Type | Description |

        | --- | --- | --- |

        | email | text | The email of the parent |

        | parentName | text | The name of the parent |

        | phoneNumber | text | The phone number of the parent |


        ## Response


        The response for this request is a JSON schema, which includes the
        details of the newly created support parent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: sample email
                parentName: sample name
                phoneNumber: sample phone number
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /parent/{emailOrPhone}:
    get:
      tags:
        - parents
      summary: get parents details by email or phone
      description: >-
        # Retrieve Parent Details


        This endpoint retrieves the details of a parent based on their email or
        phone number.


        ## Request


        ### Path Parameters


        - `emailOrPhone` (string, required) - The email or phone number of the
        parent.
            

        ## Response


        The response will be a JSON object with the following properties:


        - `id` (string) - The unique identifier of the parent.
            
        - `name` (string) - The name of the parent.
            
        - `email` (string) - The email address of the parent.
            
        - `phone` (string) - The phone number of the parent.
            
        - `children` (array) - An array of children associated with the parent,
        each containing:
            
            - `id` (string) - The unique identifier of the child.
                
            - `name` (string) - The name of the child.
                
            - `age` (integer) - The age of the child.
                

        ``` json

        {
          "id": "string",
          "name": "string",
          "email": "string",
          "phone": "string",
          "children": [
            {
              "id": "string",
              "name": "string",
              "age": 0
            }
          ]
        }

         ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: emailOrPhone
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /search/filter/parents:
    get:
      tags:
        - parents
      summary: search filter parents
      description: >-
        This endpoint makes an HTTP GET request to search and filter parent
        records based on the provided parameters. The request includes query
        parameters such as page number, page size, parent name, phone number,
        and email.


        ### Request Parameters


        - `page` (number): The page number for paginated results.
            
        - `pageSize` (number): The number of results to be included in a single
        page.
            
        - `parentName` (string): The name of the parent to be searched.
            
        - `phoneNumber` (string): The phone number of the parent to be searched.
            
        - `email` (string): The email of the parent to be searched.
            

        ### Response


        The response will include the filtered parent records based on the
        provided parameters. The structure of the response will depend on the
        backend implementation and may include details such as parent
        information, contact details, and any other relevant data.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: pageSize
          in: query
          schema:
            type: integer
          example: '10'
        - name: parentName
          in: query
          schema:
            type: string
          example: Parent
        - name: phoneNumber
          in: query
          schema:
            type: string
          example: '%2B12412412512'
        - name: email
          in: query
          schema:
            type: string
          example: 'null'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /add:
    post:
      tags:
        - taxi
      summary: add taxi
      description: >-
        ### Add Taxi


        This endpoint allows you to add a new taxi company to the system.


        #### Request Body


        - `taxiCompanyName` (string): The name of the taxi company.
            
        - `taxiCode` (string): The unique code for the taxi company.
            
        - `taxiCity` (string): The city where the taxi company is located.
            
        - `taxiState` (string): The state where the taxi company is located.
            
        - `bgColor` (string): The background color for the taxi company's
        branding.
            
        - `textColor` (string): The text color for the taxi company's branding.
            
        - `primaryColor` (string): The primary color for the taxi company's
        branding.
            
        - `secondaryColor` (string): The secondary color for the taxi company's
        branding.
            
        - `taxiName` (string): The name of the taxi.
            
        - `taxiLogo` (file): The logo of the taxi company in base64-encoded
        format.
            
        - `zipCode` (array): service area zip codes.
        #### Response


        The response will include the status of the request, along with any
        relevant information about the newly added taxi company.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                taxiCompanyName: <Name of taxi company> sdsd
                taxiCode: sample taxi code
                taxiCity: <City og Taxi company>
                taxiState: <State of Taxi Company>
                bgColor: sample
                textColor: sample
                primaryColor: sample
                secondaryColor: sample
                taxiName: sample name
                zipcode: [50179, 20178]
                taxiLogo: >-
                  data:image/jpeg;base64,
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: UserId
          in: header
          schema:
            type: string
          example: '{{UserId}}'
      responses:
        '200':

  /api/webhook_endpoints:
    post:
      tags:
        - Webhooks 
      summary: Register a new webhook endpoint
      description: Register a webhook URL for a taxi service using their taxi code and API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - taxiCode
                - taxiApiKey
              properties:
                url:
                  type: string
                  format: uri
                  description: The webhook URL where notifications will be sent
                  example: "https://api.taxiservice.com/webhooks"
                taxiCode:
                  type: string
                  description: Unique identifier for the taxi service
                  example: "TAXI123"
                taxiApiKey:
                  type: string
                  description: API key for authentication
                  example: "sk_test_abc123xyz"
      responses:
        '201':
          description: Webhook endpoint registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Webhook endpoint registered successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: "123e4567-e89b-12d3-a456-426614174000"
                      url:
                        type: string
                        format: uri
                        example: "https://api.taxiservice.com/webhooks"  
                      taxiCode:
                        type: string
                        example: "TAXI123"
                      taxiApiKey:
                        type: string
                        example: "sk_test_abc123xyz"
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-03-14T12:00:00Z"
        '400':
          description: Bad request - missing required fields or invalid taxi credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Invalid taxi code or API key"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Failed to register webhook endpoint"
                  message:
                    type: string
                    example: "Internal server error"


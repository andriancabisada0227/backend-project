  /driver/latest:
    get:
      tags:
        - parents api
      summary: get parent driver
      description: |-
        # Get Latest Driver for Parents

        This endpoint retrieves the latest driver details for parents.

        ## Request

        - Method: GET
            
        - URL: `localhost:3000/parents/driver/latest`
            

        ## Response

        The response will include the following details:

        - `driverId`: The unique identifier of the driver.
            
        - `name`: The name of the driver.
            
        - `licenseNumber`: The license number of the driver.
            
        - `vehicleNumber`: The vehicle number associated with the driver.
            
        - `status`: The current status of the driver.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: UserId
          in: header
          schema:
            type: string
          example: 44218e77-7a57-4fec-8404-5d37795959af
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /:
    post:
      tags:
        - ride cost
      summary: ride cost
      description: >-
        The `POST /ridecost` endpoint calculates the ride cost for the given
        students based on their distances traveled. The request should include
        an array of objects, where each object contains the `studentId` and
        `distance` properties.


        ### Request Body


        - `students` (array of objects)
            
            - `studentId` (string): The unique identifier of the student.
                
            - `distance` (number): The distance traveled by the student.
                

        ### Response


        The response will be a JSON object with the following properties:


        - `success` (boolean): Indicates if the request was successful.
            
        - `data` (array of objects): Contains the details of the students with
        the calculated ride cost.
            
            - `studentId` (string): The unique identifier of the student.
                
            - `studentName` (string): The name of the student.
                
            - `imageUrl` (string): The URL of the student's image.
                
            - `cost` (number): The calculated cost of the ride for the student.
                

        #### JSON Schema


        ``` json

        {
          "type": "object",
          "properties": {
            "success": {
              "type": "boolean"
            },
            "data": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "studentId": {
                    "type": "string"
                  },
                  "studentName": {
                    "type": "string"
                  },
                  "imageUrl": {
                    "type": "string"
                  },
                  "cost": {
                    "type": "number"
                  }
                }
              }
            }
          }
        }

         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                success: true
                data:
                  - studentId: f72f01bd-2d6c-4145-9d8d-4bb03a36ba2a
                    studentName: sample student Name
                    imageUrl: sample image url
                    cost: 20
                  - studentId: f72f01bd-2d6c-4145-9d8d-4bb03a36ba2a
                    studentName: sample student Name 1
                    imageUrl: sample image url
                    distance: 15
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    get:
      tags:
        - driver api
      summary: search filters
      description: >-
        ### GET /drivers


        This HTTP GET request is used to search for drivers based on specified
        filters. The request should be made to the `localhost:3000//drivers`
        endpoint.


        #### Request Parameters


        - `gender` (string): The gender of the driver being searched for
            
        - `vehicleType` (string): The type of vehicle being searched for
            
        - `ageLimit_low` (number): The lower age limit for the drivers
            
        - `ageLimit_high` (number): The upper age limit for the drivers
            
        - `radius` (number): The radius within which to search for drivers
            
        - `page` (number): The page number for pagination
            
        - `latitude` (number): The latitude coordinate for the search
            
        - `longitude` (number): The longitude coordinate for the search
            
        - `pagesize` (number): The number of results per page
            

        #### Response


        The response to this request will have a status code of 500, and will
        include a JSON object with the following properties:


        ``` json

        {
          "success": "boolean",
          "error": "string"
        }

         ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: UserId
          in: header
          schema:
            type: string
          example: c7e76677-7b7f-49da-b454-c374cef9a022
        - name: gender
          in: query
          schema:
            type: string
          example: Female
        - name: vehicleType
          in: query
          schema:
            type: string
          example: Van
        - name: ageLimit_low
          in: query
          schema:
            type: integer
          example: '20'
        - name: ageLimit_high
          in: query
          schema:
            type: integer
          example: '40'
        - name: radius
          in: query
          schema:
            type: integer
          example: '4'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: latitude
          in: query
          schema:
            type: number
          example: '37.33285340665878'
        - name: longitude
          in: query
          schema:
            type: number
          example: '-121.87834138055486'
        - name: pagesize
          in: query
          schema:
            type: integer
          example: '100'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /{id}:
    delete:
      tags:
        - bookRide
      summary: delete
      description: >-
        # Delete Booking


        This endpoint is used to delete a specific booking by providing the
        booking ID in the URL.


        ## Request


        - Method: DELETE
            
        - URL: localhost:3000/ooking/:id
            

        ### Path Parameters


        - `id` (string, required): The ID of the booking to be deleted.
            

        ## Response


        The response will not contain a message body. A successful deletion will
        return a status code 200, indicating that the booking has been
        successfully deleted. If the provided booking ID does not exist, the
        response will return a status code 404.
      parameters:
        - name: UserId
          in: header
          schema:
            type: string
        - name: Authorization
          in: header
          schema:
            type: string
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    get:
      tags:

         ```
      requestBody:
        content: {}
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /edit:
    put:
      tags:
        - parents api
      summary: edit parent
      description: >-
        This endpoint allows you to update the details of a parent. The HTTP PUT
        request should be made to localhost:3000/parent/edit with the following

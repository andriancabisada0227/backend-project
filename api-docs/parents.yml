          content:
            application/json: {}
  /location/add:
    post:
      tags:
        - driver api
      summary: add driver location
      description: |-
        ### Add Driver Location

        This endpoint is used to add the location of a driver.

        #### Request Body

        - `location` (object)
            
            - `country` (string)
                
            - `city` (string)
                
            - `state` (string)
                
            - `latitude` (number)
                
            - `longitude` (number)
                

        Example:

        ``` json
        {
          "location": {
            "country": "United States",
            "city": "San Ramon",
            "state": "CA",
            "latitude": 37.781555,
            "longitude": -121.93707
          }
        }

         ```

        #### Response

        The response for this request is a JSON schema.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                location:
                  country: United States
                  city: San Ramon
                  state: CA
                  latitude: 37.781555
                  longitude: -121.93707
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: UserId
          in: header
          schema:
            type: string
          example: 5801120d-fe45-422d-864f-19820c1a0549
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}

paths:
  /andre09090@gmail.com:
    get:
      tags:
        - token
      summary: refresh token
      description: >-
        ### Refresh Token for User


        This endpoint sends an HTTP GET request to
        `localhost:3000/refreshtoken/andre09090@gmail.com` to refresh the token
        for the specified user.


        #### Request Body


        This request does not contain a request body.


        #### Response Body


        The response of this request is a JSON object with the following
        properties:


        - `access_token` (string)
            
        - `token_type` (string)
            
        - `expires_in` (integer)
            
        - `refresh_token` (string)
            
        - `scope` (string)
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /{userId}:

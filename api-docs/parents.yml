        ``` json

        {
          "parentName": "string",
          "address": "string",
          "city": "string",
          "country": "string",
          "emergencyPersonName": "string",
          "emergencyPhoneNumber": "string"
        }

         ```

        The request body should include the updated parent's name, address,
        city, country, emergency contact person's name, and emergency contact
        phone number.


        The response to this request will provide the updated details of the
        parent after the edit operation.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                parentName: Jackson Kai
                address: Home
                city: California
                country: USA
                emergencyPersonName: Miller
                emergencyPhoneNumber: '5223514221'
      parameters:

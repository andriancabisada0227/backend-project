      summary: get
      description: >-
        # Get Booking Details


        This endpoint retrieves the details of a specific booking identified by
        the provided ID.


        ## Request


        - Method: GET
            
        - URL: `localhost:3000/booking/:id`
            

        ## Response


        The response for this request is a JSON object with the following
        schema:


        ``` json

        {
          "type": "object",
          "properties": {
            // Include the properties of the response object here
          }
        }

         ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: '{{Authorization}}'
        - name: UserId
          in: header
          schema:
            type: string
          example: '{{UserId}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
          example: add7296c-53df-43a8-a980-2ee055ba20c7
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
        - bookRide
      summary: edit
      description: >-
        This endpoint allows the user to update a specific booking by sending an
        HTTP PUT request to the provided URL with the booking ID in the path
        parameter.


        ### Request Parameters


        - No specific request parameters are mentioned.
            

        ### Response


        The response of this request is provided as a JSON schema, detailing the
        structure of the data that will be returned upon a successful update of
        the booking. The JSON schema will outline the properties and their types
        that can be expected in the response.


        Example JSON Schema:


        ``` json

        {
          "type": "object",
          "properties": {
            "bookingId": {
              "type": "string"
            },
            "status": {
              "type": "string"
            },
            "updatedAt": {
              "type": "string",
              "format": "date-time"
            }
          }

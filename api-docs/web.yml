  /service-areas:
    get:
      tags:
        - Service Areas
      summary: Get all service areas
      description: Retrieves a list of all service areas
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceArea'
        '500':
          description: Server error
          
    post:
      tags:
        - Service Areas
      summary: Add new service area
      description: Creates a new service area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zipCodes:
                  type: array
                  items:
                    type: number
                  description: Array of zip codes for the service area
              required:
                - zipCode
              example:
                zipCode: [50179, 50178]
      responses:
        '201':
          description: Service area created successfully
        '400':
          description: Invalid input
        '500':
          description: Server error

  /service-areas/{id}:
    get:
      tags:
        - Service Areas
      summary: Get service area by ID
      description: Retrieves a specific service area by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the service area
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceArea'
        '404':
          description: Service area not found
        '500':
          description: Server error
          
    put:
      tags:
        - Service Areas
      summary: Update service area
      description: Updates an existing service area
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the service area to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAreaInput'
      responses:
        '200':
          description: Service area updated successfully
        '400':
          description: Invalid input
        '404':
          description: Service area not found
        '500':
          description: Server error
          
    delete:
      tags:
        - Service Areas
      summary: Delete service area
      description: Deletes a specific service area
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the service area to delete
          schema:
            type: string
      responses:
        '200':
          description: Service area deleted successfully
        '404':
          description: Service area not found
        '500':
          description: Server error

components:
  schemas:
    ServiceArea:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the service area
        zipCodes:
          type: array
          items:
            type: number
          description: Array of zip codes in this service area
        createdAt:
          type: string
          format: date-time
          description: When the service area was created
        updatedAt:
          type: string
          format: date-time
          description: When the service area was last updated
      required:
        - id
        - zipCodes
    
    ServiceAreaInput:
      type: object
      properties:
        zipCodes:
          type: array
          items:
            type: number
          description: Array of zip codes for the service area
      required:
        - zipCodes
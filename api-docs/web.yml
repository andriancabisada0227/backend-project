        - email (string, required): The email address of the user who has
        forgotten their password.
            

        ### Response


        The response of this request is a JSON object with the following schema:


        ``` json

        {
          "message": "string",
          "data": {}
        }

         ```

        - message (string): A message indicating the outcome of the password
        reset request.
            
        - data (object): An empty object is returned in the data field.

    post:
      tags:
        - other api's
      summary: verify forgot password
      description: >-
        The `POST /schools/verify/forgot/password` endpoint is used to verify
        and reset a forgotten password for a school user.


        ### Request Body


        - email (string, required): The email address of the user requesting the
        password reset.
            
        - token (string, required): The verification token received by the user
        for password reset.
            

        ### Response


        The response of this request is a JSON object with the following schema:


        ``` json

        {
          "status": "string",
          "message": "string"
        }

         ```

        - status (string): Indicates the status of the password reset
        verification.
            
        - message (string): Provides additional information about the password
        reset verification status.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: new password
                token: sample token
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
